<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diabetes Predictor</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef5f8;color:#1f2d3d}
.container{max-width:1180px;margin:30px auto;background:#fff;border:1px solid #d9e2e7;border-radius:18px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.hero{padding:34px 42px;border-bottom:1px solid #e1e7eb}.kicker{color:#19758b;font-weight:800;letter-spacing:1.4px;font-size:15px}.hero h1{margin:14px 0 8px;font-size:42px}.hero p{margin:0;color:#657380;font-size:18px}
.form{padding:28px 42px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px;border:1px solid #ccd7dd;border-radius:8px;font-size:16px}.field small{display:block;color:#9aa7b0;margin-top:5px}
.actions{padding:0 42px 28px}.actions button{width:100%;padding:15px;border:0;border-radius:8px;background:#167d91;color:#fff;font-weight:800;font-size:18px;cursor:pointer}.actions button:hover{filter:brightness(.95)}
.result-wrap{padding:22px 42px 40px;border-top:1px solid #e1e7eb}.result-wrap h2{margin:0 0 14px}.result{border-left:5px solid #167d91;background:#f3fbfd;padding:24px;border-radius:10px}.result.diabetic{border-left-color:#c62828;background:#fff5f5}.result.normal{border-left-color:#2e7d32;background:#f5fbf5}.result-title{font-size:30px;font-weight:800;margin-bottom:10px}.confidence{font-size:20px;font-weight:700}.note{margin-top:12px;color:#657380;font-size:14px}
@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}}
@media(max-width:600px){.container{margin:0;border-radius:0}.hero,.form,.actions,.result-wrap{padding-left:18px;padding-right:18px}.form{grid-template-columns:1fr}.hero h1{font-size:29px}}
</style></head>
<body>
<div class="container">
<section class="hero"><div class="kicker">DIABETES PREDICTOR</div><h1>Nhập thông tin sức khỏe</h1><p>Điền các thuộc tính để gửi dự đoán đến API. Mô hình triển khai hiện sử dụng Glucose, BMI và Age.</p></section>
<form id="form" class="form">
<div class="field"><label>Pregnancies</label><input id="pregnancies" type="number" step="any" placeholder="Không bắt buộc"></div>
<div class="field"><label>Glucose *</label><input id="glucose" type="number" step="any" required placeholder="Ví dụ: 100"></div>
<div class="field"><label>BloodPressure</label><input id="bp" type="number" step="any" placeholder="Không bắt buộc"></div>
<div class="field"><label>SkinThickness</label><input id="skin" type="number" step="any" placeholder="Không bắt buộc"></div>
<div class="field"><label>Insulin</label><input id="insulin" type="number" step="any" placeholder="Không bắt buộc"></div>
<div class="field"><label>BMI *</label><input id="bmi" type="number" step="any" required placeholder="Ví dụ: 30"></div>
<div class="field"><label>DiabetesPedigreeFunction</label><input id="dpf" type="number" step="any" placeholder="Không bắt buộc"></div>
<div class="field"><label>Age *</label><input id="age" type="number" step="any" required placeholder="Ví dụ: 29"></div>
<div class="field"><label>Outcome</label><input value="Do mô hình dự đoán" disabled></div>
</form>
<div class="actions"><button id="predictBtn">Dự đoán</button></div>
<section class="result-wrap"><h2>Kết quả</h2><div id="result" class="result" style="display:none"><div id="title" class="result-title"></div><div id="confidence" class="confidence"></div><div class="note">Kết quả chỉ mang tính hỗ trợ dự đoán và không thay thế chẩn đoán y khoa chuyên môn.</div></div></section>
</div>
<script>
const form=document.getElementById('form');
const result=document.getElementById('result');
const title=document.getElementById('title');
const confidence=document.getElementById('confidence');
document.getElementById('predictBtn').addEventListener('click', async ()=>{
  if(!form.reportValidity()) return;
  const payload={Glucose:Number(glucose.value),BMI:Number(bmi.value),Age:Number(age.value)};
  try{
    const res=await fetch('/diabetes/v1/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'API error');
    result.style.display='block';
    const isDiabetic=data.prediction===1;
    result.className='result '+(isDiabetic?'diabetic':'normal');
    title.textContent=isDiabetic?'Bị tiểu đường':'Không bị tiểu đường';
    confidence.textContent='Độ tin cậy: '+data.confidence+'%';
  }catch(e){
    result.style.display='block'; result.className='result diabetic'; title.textContent='Không thể dự đoán'; confidence.textContent=e.message;
  }
});
</script></body></html>
